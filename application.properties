spring.application.name=fintrack
server.port=8080

# Default: embedded H2 database, so the app can start without installing MySQL.
# Data is stored in backend/fintrack-data; no username/password setup is needed.
spring.datasource.url=jdbc:h2:file:./fintrack-data;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

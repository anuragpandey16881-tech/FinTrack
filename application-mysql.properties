# Optional MySQL configuration. Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/fintrack
spring.datasource.username=${FINTRACK_DB_USERNAME:root}
spring.datasource.password=${FINTRACK_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
